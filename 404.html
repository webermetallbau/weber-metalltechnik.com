<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden | Weber Metallbau GmbH</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<script>
/* Alte Adressen der WordPress-Seite (/leistungen/, /galerie/ …) auf die neuen Seiten führen. */
(function(){
  var p = location.pathname.replace(/\/+$/, "") || "/";
  var karte = {"/galerie": "/referenzen", "/start": "/", "/home": "/"};
  var ziel = karte[p] || (p !== location.pathname ? p : null);
  location.replace(ziel || "/");
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:40px">
<p>Diese Seite gibt es nicht mehr. <a href="/">Zur Startseite von Weber Metallbau</a></p>
